name: IPTV 自动更新

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 M3U8
        run: python auto_check.py

      - name: 提交结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cnTV_AutoUpdate.m3u8
          git diff --cached --quiet || git commit -m "自动更新 M3U8 播放列表"
          git push
